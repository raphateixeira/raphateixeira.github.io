# _quarto.yml
project:
  type: website

website:
  title: "Raphael Teixeira"
  description: "Prof. Dr. Raphael Teixeira — ensino e pesquisa em controle, identificação de sistemas e eletrônica de potência (UFPA, Campus de Tucuruí)."
  site-url: https://raphateixeira.github.io
  favicon: imagens/rt-logo.svg

  # Navbar branca (estilo vem da camada "Site" do TemaRTx.scss). Sem barra lateral:
  # os links institucionais, bases de pesquisa e perfis ficam no rodapé (_rodape.html).
  navbar:
    background: "#FFFFFF"
    foreground: "#0F1B33"
    logo: imagens/rt-logo.svg
    logo-alt: "RT"
    left:
      - text: "Ensino"
        href: https://raphateixeira.github.io/Ensino/
      - text: "Pesquisa"
        href: Pesquisa/index.qmd
      - text: "Projetos"
        href: Projetos/index.qmd
      - text: "Publicações"
        href: Publicacoes/index.qmd
      - text: "LINCE"
        href: LINCE/index.qmd
      - text: "Notas"
        href: https://raphateixeira.github.io/Notas/
      - text: "Documentos"
        href: Documentos/index.qmd
    right:
      - icon: github
        href: https://github.com/raphateixeira
        aria-label: GitHub
      - icon: envelope
        href: mailto:raphaelbt@ufpa.br
        aria-label: E-mail

format:
  html:
    # TemaRTx.scss: tema compartilhado, baixado de raphateixeira/.github no build (não versionado).
    # custom.scss: componentes próprios deste site (página inicial, Ensino, Publicações...).
    theme:
      light: [cosmo, TemaRTx.scss, custom.scss]
    toc: false
    lang: pt
    include-after-body: _rodape.html
