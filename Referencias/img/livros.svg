<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="480" height="320" fill="#E7EEFA"/>
  <!-- shelf -->
  <rect x="50" y="250" width="380" height="14" rx="3" fill="#5A6472"/>
  <!-- book spines -->
  <g stroke-linecap="round">
    <rect x="70" y="110" width="26" height="140" fill="#002C6F"/>
    <rect x="100" y="90" width="26" height="160" fill="#5A6472"/>
    <rect x="130" y="130" width="26" height="120" fill="#002C6F"/>
    <rect x="160" y="70" width="26" height="180" fill="#8FA7CE"/>
    <rect x="190" y="105" width="26" height="145" fill="#5A6472"/>
    <rect x="220" y="85" width="26" height="165" fill="#002C6F"/>
  </g>
  <!-- leaning book -->
  <g transform="translate(300,180) rotate(-18)">
    <rect x="0" y="0" width="34" height="150" fill="#8FA7CE"/>
    <rect x="0" y="0" width="34" height="14" fill="#002C6F"/>
  </g>
  <rect x="350" y="150" width="30" height="100" fill="#5A6472"/>
</svg>
